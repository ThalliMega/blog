<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 201 201"
	id="ThalliMega"
>
    <style>
    	svg#ThalliMega {
     		color-scheme: dark light;
     	}
        line.ThalliMega {
            stroke: currentColor;
        }
        ellipse.ThalliMega {
            fill: currentColor;
        }
    </style>
    <line
		x1="50.25"
		y1="-50.25"
		x2="-50.25"
		y2="50.25"
		transform="translate(50.25 50.25)"
		fill="none"
		class="ThalliMega"
	/>
    <line
		x1="-50.25"
		y1="-50.25"
		x2="50.25"
		y2="50.25"
		transform="translate(50.25 150.75)"
		fill="none"
		class="ThalliMega"
	/>
    <line
		x1="-50.25"
		y1="50.25"
		x2="50.25"
		y2="-50.25"
		transform="translate(150.75 150.75)"
		fill="none"
		class="ThalliMega"
	/>
    <line
		x1="50.25"
		y1="50.25"
		x2="-50.25"
		y2="-50.25"
		transform="translate(150.75 50.25)"
		fill="none"
		class="ThalliMega"
	/>
    <ellipse
		rx="1"
		ry="1"
		transform="translate(100.5 100.5)"
		stroke-width="0"
		class="ThalliMega"
	/>
</svg>
